[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foul-up-3"
version = "0.1.0"
description = "NBA myth-buster: does intentionally fouling up 3 with under 24 seconds left actually help?"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy",
    "pyarrow",
    "scipy",
    "statsmodels",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
foulup3 = "foulup3.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
